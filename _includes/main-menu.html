<div id="main-menu" class="main-menu">
  {% assign mainmenu = site.data.menus.main | sort: 'weight'  %}
  <ul>
    {% for item in mainmenu %}
    <li class="{% unless item.external %}{% if item.url == page.url %}active{% endif %}{% endunless %}">
      {% if item.external %}
      <a href="{{ item.url }}" class="menu-link-external" target="_blank" rel="noopener noreferrer">
        {{ item.name }}
        <svg class="menu-external-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="15 3 21 3 21 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="10" y1="14" x2="21" y2="3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      {% else %}
      <a href="{{ item.url | relative_url }}">{{ item.name }}</a>
      {% endif %}
    </li>
    {% endfor %}
  </ul>
</div>
