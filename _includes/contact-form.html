<form id="contact-form" class="contact-form" action="{{ site.data.contact.form_api_url }}" method="post" novalidate>
  <div class="form-group">
    <label for="contact-subject">您希望解决什么问题？ <span class="required">*</span></label>
    <input id="contact-subject" class="form-control" type="text" name="subject" maxlength="100" required autocomplete="off" />
  </div>

  <div class="form-group">
    <label for="contact-name">联系人 <span class="required">*</span></label>
    <input id="contact-name" class="form-control" type="text" name="name" maxlength="50" required autocomplete="name" />
  </div>

  <div class="form-group">
    <label for="contact-cellphone">手机号 <span class="required">*</span></label>
    <input id="contact-cellphone" class="form-control" type="tel" name="cellphone" maxlength="11" pattern="1[3-9]\d{9}" required autocomplete="tel" inputmode="numeric" />
  </div>

  <div class="form-group">
    <label for="contact-company">企业 <span class="optional">（选填）</span></label>
    <input id="contact-company" class="form-control" type="text" name="company" maxlength="100" autocomplete="organization" />
  </div>

  <div class="form-group">
    <label for="contact-content">咨询内容 <span class="required">*</span></label>
    <textarea id="contact-content" class="form-control" name="content" rows="6" maxlength="2000" required></textarea>
  </div>

  {% comment %} Honeypot：对真人隐藏，机器人常会填写 {% endcomment %}
  <div class="contact-form-honeypot" aria-hidden="true">
    <label for="contact-website">网站</label>
    <input id="contact-website" type="text" name="website" tabindex="-1" autocomplete="off" />
  </div>

  <div id="contact-form-status" class="contact-form-status" role="status" aria-live="polite" hidden></div>

  <div class="form-actions">
    <button type="submit" class="button contact-form-submit" id="contact-form-submit">提交预约申请</button>
  </div>
</form>

<script>
(function () {
  var form = document.getElementById('contact-form');
  if (!form) return;

  var statusEl = document.getElementById('contact-form-status');
  var submitBtn = document.getElementById('contact-form-submit');
  var phoneRe = /^1[3-9]\d{9}$/;

  function showStatus(type, message) {
    statusEl.hidden = false;
    statusEl.className = 'contact-form-status is-' + type;
    statusEl.textContent = message;
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();

    var subject = (form.subject.value || '').trim();
    var name = (form.name.value || '').trim();
    var cellphone = (form.cellphone.value || '').trim();
    var company = (form.company.value || '').trim();
    var content = (form.content.value || '').trim();
    var website = (form.website.value || '').trim();

    if (!subject || subject.length > 100) {
      showStatus('error', '请填写主题（1-100 字）');
      form.subject.focus();
      return;
    }
    if (!name || name.length > 50) {
      showStatus('error', '请填写联系人姓名（1-50 字）');
      form.name.focus();
      return;
    }
    if (!phoneRe.test(cellphone)) {
      showStatus('error', '请填写正确的手机号');
      form.cellphone.focus();
      return;
    }
    if (company.length > 100) {
      showStatus('error', '企业名称过长');
      form.company.focus();
      return;
    }
    if (!content || content.length > 2000) {
      showStatus('error', '请填写咨询内容（1-2000 字）');
      form.content.focus();
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = '提交中…';
    showStatus('pending', '正在提交，请稍候…');

    fetch(form.action, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        subject: subject,
        name: name,
        cellphone: cellphone,
        company: company,
        content: content,
        website: website
      })
    })
      .then(function (res) {
        return res.json().then(function (data) {
          return { ok: res.ok && data.ok, message: data.message || (res.ok ? '提交成功' : '提交失败，请稍后重试') };
        });
      })
      .then(function (result) {
        if (result.ok) {
          showStatus('success', result.message);
          form.reset();
        } else {
          showStatus('error', result.message);
        }
      })
      .catch(function () {
        showStatus('error', '网络异常，请稍后重试');
      })
      .finally(function () {
        submitBtn.disabled = false;
        submitBtn.textContent = '提交预约申请';
      });
  });
})();
</script>
